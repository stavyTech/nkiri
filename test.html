<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<link rel="stylesheet" href="mainbjh,yguigl.css">
</head>
<body>

<div class="container">

<div class="card">
<h2 id="title">Login</h2>

<input id="username" placeholder="Username">
<input id="email" placeholder="Email">
<input id="password" placeholder="Password">

<button onclick="handle()">Continue</button>

<p onclick="toggle()" style="cursor:pointer;color:#1e40af;">
Switch Login/Register
</p>

</div>

</div>

<script src="app.js"></script>

<script>

let loginMode = true;

function toggle(){
  loginMode = !loginMode;
  document.getElementById("title").innerText =
  loginMode ? "Login" : "Register";
}

function handle(){

  let u = username.value;
  let e = email.value;
  let p = password.value;

  if(!loginMode){

    register(u,e,p);
    alert("Registered!");
    toggle();

  } else {

    if(login(e,p)){
      window.location.href="dashboard.html";
    } else {
      alert("Invalid login");
    }

  }

}

</script>

</body>
</html>
